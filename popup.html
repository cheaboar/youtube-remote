<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube / 抖音 / B站 / 优酷 键盘选片 · 遥控操作说明</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="heading">
      <div>
        <p class="product">YouTube / 抖音 / B站 / 优酷 键盘选片</p>

      </div>
      <button id="home" class="home" title="在当前标签页打开 YouTube 首页">首页</button>

    <label class="enable"><input id="enabled" type="checkbox">启用遥控器接管</label>
    <dl id="shortcuts" class="shortcuts"></dl>
    <p id="sequence-help" class="note"></p>
    <p id="double-help" class="help"></p>
    <button id="global" class="global">启用浏览器全局遥控</button>
    <button id="settings">配置遥控器与按键诊断</button>
  </main>
<script src="remote.js"></script><script src="popup.js"></script></body>

<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui}
ytd-shorts,ytd-reel-video-renderer{display:block;position:relative;height:100vh;overflow:hidden}
#movie_player{position:absolute;inset:0;background:#111}
#movie_player video{width:100%;height:100%}
reel-action-bar-view-model{position:absolute;right:12px;bottom:24px;z-index:2;display:flex;flex-direction:column;gap:12px}
reel-action-bar-view-model button{width:72px;height:56px;font-size:14px}
#navigation-button-up,#navigation-button-down{position:absolute;right:110px;z-index:2}
#navigation-button-up{top:12px}#navigation-button-down{bottom:12px}
#navigation-button-up button,#navigation-button-down button{width:64px;height:40px}
ytd-engagement-panel-section-list-renderer{display:none;position:absolute;left:0;right:0;bottom:0;height:56vh;background:#fff;color:#111;z-index:4}
ytd-engagement-panel-section-list-renderer[visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED"]{display:block}
ytd-engagement-panel-title-header-renderer{display:flex;justify-content:flex-end;height:40px}
ytd-comments{display:block}
#contents{height:calc(56vh - 40px);overflow-y:auto;overscroll-behavior:contain}
ytd-comment-thread-renderer,ytd-comment-view-model{display:block;height:90px;padding:8px;box-sizing:border-box;border-bottom:1px solid #ddd}
</style></head><body><ytd-shorts><ytd-reel-video-renderer>
  <div id="movie_player"><video></video></div>
  <div id="navigation-button-up"><button aria-label="Previous video">上一条</button></div>
  <div id="navigation-button-down"><button aria-label="Next video">下一条</button></div>
  <reel-action-bar-view-model>
    <like-button-view-model><button aria-pressed="false" aria-label="like this video along with 3 other people">赞</button></like-button-view-model>
    <button id="comments-toggle" aria-label="View 3 comments">评论</button>
  </reel-action-bar-view-model>
  <ytd-engagement-panel-section-list-renderer target-id="engagement-panel-comments-section" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN">
    <ytd-engagement-panel-title-header-renderer><button id="comments-close" aria-label="Close">关闭</button></ytd-engagement-panel-title-header-renderer>
    <ytd-comments id="comments"><div id="contents"></div></ytd-comments>
  </ytd-engagement-panel-section-list-renderer>
</ytd-reel-video-renderer></ytd-shorts>
<script>
window.nativeEvents = [];
window.navClicks = { up: 0, down: 0 };
window.addEventListener('keydown', e => { if (!e.defaultPrevented) window.nativeEvents.push(e.key); }, true);
const panel = document.querySelector('ytd-engagement-panel-section-list-renderer');
const comments = document.querySelector('#contents');
comments.innerHTML = Array.from({ length: 20 }, (_, i) =>
  '<ytd-comment-thread-renderer><ytd-comment-view-model id="comment">评论 ' + (i + 1) + '</ytd-comment-view-model></ytd-comment-thread-renderer>').join('');
document.querySelector('#comments-toggle').onclick = () => panel.setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_EXPANDED');
document.querySelector('#comments-close').onclick = () => panel.setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN');
const like = document.querySelector('like-button-view-model button');
like.onclick = () => like.setAttribute('aria-pressed', String(like.getAttribute('aria-pressed') !== 'true'));
document.querySelector('#navigation-button-up button').onclick = () => { window.navClicks.up++; };
document.querySelector('#navigation-button-down button').onclick = () => { window.navClicks.down++; };
document.dispatchEvent(new Event('yt-navigate-finish'));
</script></body></html>

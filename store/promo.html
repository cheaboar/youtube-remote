<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{background:#0b1020}
  .tile{width:440px;height:280px;background:radial-gradient(120% 120% at 12% 0%,#26365e 0%,#111a2f 55%,#0b1020 100%);
    color:#f5f7ff;font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;padding:26px;position:relative;overflow:hidden}
  .tile:after{content:"";position:absolute;width:280px;height:280px;right:-90px;bottom:-120px;border-radius:50%;
    background:radial-gradient(circle,#ff2d55 0%,rgba(255,45,85,0) 70%);opacity:.55}
  .kicker{font-size:12px;letter-spacing:.16em;color:#8fa6ff;text-transform:uppercase}
  h1{font-size:27px;line-height:1.25;margin:10px 0 8px;font-weight:800}
  h1 em{font-style:normal;color:#ff5c7c}
  p{font-size:13px;color:#b9c4e0;max-width:270px}
  .chips{display:flex;gap:8px;margin-top:18px;position:relative;z-index:2}
  .chips span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
  .remote{position:absolute;right:30px;top:44px;width:92px;height:190px;border-radius:26px;background:#ff2d55;
    box-shadow:0 22px 50px rgba(255,45,85,.42);transform:rotate(9deg)}
  .remote:before{content:"";position:absolute;left:50%;top:26px;transform:translateX(-50%);
    border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:34px solid #fff}
  .remote:after{content:"";position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:42px;height:9px;
    border-radius:6px;background:#fff;box-shadow:0 -18px 0 #fff}
  .waves{display:none}
  .waves i{position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid #fff;border-color:#fff transparent transparent transparent;
    border-radius:50%;opacity:.85}
  .w1{width:70px;height:70px}.w2{width:104px;height:104px;opacity:.5!important}

  .marquee{width:1400px;height:560px;background:radial-gradient(90% 130% at 8% 0%,#22335c 0%,#0d1424 58%,#080c16 100%);
    color:#f5f7ff;font:16px/1.6 "Microsoft YaHei",system-ui,sans-serif;padding:64px 72px;position:relative;overflow:hidden}
  .marquee h1{font-size:58px;line-height:1.12;font-weight:800;margin:16px 0 18px;letter-spacing:-.02em}
  .marquee h1 em{font-style:normal;color:#ff5c7c}
  .marquee p{font-size:22px;color:#b9c4e0;max-width:640px}
  .marquee .chips{margin-top:34px;gap:12px}
  .marquee .chips span{font-size:16px;padding:9px 18px}
  .bigremote{position:absolute;right:96px;top:88px;width:210px;height:400px;border-radius:52px;background:linear-gradient(160deg,#ff3d63,#e00f38);
    box-shadow:0 40px 90px rgba(255,45,85,.45);transform:rotate(10deg)}
  .bigremote:before{content:"";position:absolute;left:50%;top:54px;transform:translateX(-50%);
    border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:74px solid #fff}
  .bigremote:after{content:"";position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:92px;height:18px;
    border-radius:12px;background:#fff;box-shadow:0 -38px 0 #fff}
  .bigwaves{display:none}
  .bigwaves i{position:absolute;left:50%;top:100%;transform:translateX(-50%);border:13px solid #fff;border-color:#fff transparent transparent transparent;border-radius:50%;display:block}
  .bw1{width:150px;height:150px}.bw2{width:230px;height:230px;opacity:.5}
  .grid{position:absolute;right:-60px;bottom:-140px;width:640px;height:420px;border-radius:36px;
    background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);transform:rotate(-8deg)}
</style></head><body>

<div class="tile" id="tile">
  <div class="waves"><i class="w1"></i><i class="w2"></i></div>
  <div class="remote"></div>
  <div class="kicker">Chrome / Edge 扩展</div>
  <h1>遥控器也能<br><em>选片</em>和播放</h1>
  <p>YouTube、抖音、B站、优酷，一套方向键走遍全站。</p>
  <div class="chips"><span>方向键选片</span><span>双击面板</span><span>全局遥控</span></div>
</div>

<div class="marquee" id="marquee">
  <div class="grid"></div>
  <div class="bigwaves"><i class="bw1"></i><i class="bw2"></i></div>
  <div class="bigremote"></div>
  <div class="kicker" style="font-size:20px;letter-spacing:.2em;color:#8fa6ff">CHROME / EDGE EXTENSION</div>
  <h1>用蓝牙遥控器<br>控制电脑上的<em>视频网站</em></h1>
  <p>方向键选片，确认键播放。双击打开指令面板，三击进入浏览器全局遥控——YouTube、抖音、B站、优酷通用。</p>
  <div class="chips"><span>方向键选片</span><span>指令面板</span><span>浏览器全局模式</span><span>自定义组合键</span></div>
</div>

</body></html>
